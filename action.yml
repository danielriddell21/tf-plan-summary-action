name: Terraform Plan Summary
description: Parses terraform show -json output and writes a human-readable diff table to the GitHub Actions job summary.

branding:
  icon: layers
  color: purple

inputs:
  plan-file:
    description: Path to the terraform show -json output file, relative to the workspace root.
    required: false
    default: plan.json

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: false

    - name: Install unum
      shell: bash
      run: go install github.com/danielriddell21/unum/cmd/unum@latest

    - name: Build summariser
      shell: bash
      run: go build -o /tmp/tf-plan-summary "${{ github.action_path }}"

    - name: Write plan summary
      shell: bash
      run: /tmp/tf-plan-summary "${{ inputs.plan-file }}"
