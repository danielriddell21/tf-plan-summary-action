name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Install unum
        run: go install github.com/danielriddell21/unum/cmd/unum@latest

      - name: Run tests
        run: bash scripts/test.sh
